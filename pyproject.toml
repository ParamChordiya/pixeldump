[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixeldump"
version = "0.1.0"
description = "Gen-Z-flavored AI photo organizer CLI/TUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Param Chordiya", email = "param1111.chordiya@gmail.com" }]
keywords = ["photos", "organizer", "ai", "cli", "tui", "exif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=0.58",
    "rich>=13.7",
    "click>=8.1",
    "Pillow>=10.2",
    "pillow-heif>=0.16",
    "exifread>=3.0",
    "imagehash>=4.3",
    "anthropic>=0.34",
    "ollama>=0.2",
    "pyyaml>=6.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
pixeldump = "pixeldump.cli:main"

[project.urls]
Homepage = "https://github.com/ParamChordiya/pixeldump"
Repository = "https://github.com/ParamChordiya/pixeldump"
Issues = "https://github.com/ParamChordiya/pixeldump/issues"
Changelog = "https://github.com/ParamChordiya/pixeldump/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pixeldump"]

[tool.hatch.build.targets.sdist]
include = ["src/pixeldump", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
implicit_reexport = false
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "exifread.*",
    "imagehash.*",
    "ollama.*",
    "pillow_heif.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/pixeldump"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
